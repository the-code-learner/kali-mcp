name: Kali MCP beta.15 release checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-beta15.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(cat VERSION)" = "0.1.0-beta.15"
