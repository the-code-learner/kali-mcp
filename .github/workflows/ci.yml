name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest PyYAML
      - name: Validate single-file Compose syntax
        env:
          KALI_MCP_ADMIN_PASSWORD: CI_TEST_ONLY_ADMIN_PASSWORD_2026
        run: docker compose -f kali-mcp.yml config --quiet
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Unit and integration tests
        run: pytest -q
